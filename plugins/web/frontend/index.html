<!DOCTYPE html>
<html>

<head>

<meta name="google-site-verification" content="45gxYl8vF415DmDbZKn5YJpwm7lfrt-HMHY6vKLZfbI" />

<meta name="google-site-verification" content="dXM2gbh2OB6VfqpGBFb1ukklfdxH60y3PnuqiZj1pWM" />

<title>i.Tube</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
}


header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px;
    background:#181818;
}


.logo{
    font-size:30px;
    font-weight:bold;
    color:red;
}


button{
    padding:12px 20px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    margin:5px;
}


.login{
    background:#333;
    color:white;
}


.register{
    background:red;
    color:white;
}


.upload{
    background:#2563eb;
    color:white;
}


.logout{
    background:#555;
    color:white;
}

.delete{
    background:#b91c1c;
    color:white;
}


.like{
    background:#16a34a;
    color:white;
}


.dislike{
    background:#dc2626;
    color:white;
}



.container{

    text-align:center;
    padding:50px 20px;

}



.card{

    background:#222;
    padding:20px;
    margin:20px auto;
    border-radius:15px;
    max-width:600px;

}



.video-card{

    background:#222;
    padding:15px;
    margin:15px auto;
    border-radius:15px;
    max-width:600px;

}


video{

    width:100%;
    border-radius:10px;

}


</style>

</head>


<body>


<header>


<div class="logo">
i.Tube
</div>


<div id="menu">


<button class="login"
onclick="location.href='login.html'">

Login

</button>


<button class="register"
onclick="location.href='register.html'">

Create Account

</button>


</div>


</header>



<div class="container">


<h1>
Welcome to i.Tube
</h1>


<p>
Watch and share videos
</p>



<div class="card">


<h2 id="status">
Guest
</h2>


<button class="upload"
onclick="location.href='upload.html'">

Upload Video

</button>


</div>



<h2>
Trending Videos
</h2>


<div id="videos">

Loading videos...

</div>



</div>





<script>


async function checkUser(){


    const token =
    localStorage.token;


    if(!token){

        return;

    }



    try{


        const res =
        await fetch("/accounts/me",{

            headers:{

                "Authorization":
                "Bearer "+token

            }

        });



        const data =
        await res.json();



        if(data.success){


            document.getElementById("status")
            .innerHTML =
            "Welcome "+data.user.username;



            document.getElementById("menu").innerHTML = `


<button class="upload"
onclick="location.href='upload.html'">

Upload Video

</button>


<button class="upload"
onclick="location.href='shorts.html'">

Shorts

</button>


<button class="upload"
onclick="location.href='edit-channel.html?id=${data.user.channel_id}'">

Edit Channel

</button>



<button class="logout"
onclick="logout()">

Logout

</button>


<button class="delete"
onclick="location.href='delete-account.html'">

Delete Account

</button>


`;


        }



    }catch(e){

        console.log(e);

    }


}





function logout(){

    localStorage.removeItem("token");

    location.reload();

}



function openChannel(id){

    location.href =
    "channel.html?id="+id;

}



async function loadVideos(){


    const box =
    document.getElementById("videos");



    try{


        const res =
        await fetch("/videos/list");



        const videos =
        await res.json();


        const normalVideos =
        videos.filter(
        v=>v.type !== "short"
         );


        if(videos.length===0){


            box.innerHTML =
            "No videos yet";


            return;

        }




        box.innerHTML="";



        normalVideos.forEach(video=>{



            const div =
            document.createElement("div");



            div.className =
            "video-card";



            div.innerHTML = `


            <video controls>

            <source src="/videos/watch/${video.file}">

            </video>



            <h3>
${video.title}
</h3>

<button onclick="openChannel(${video.channel_id})">

Visit Channel

</button>


<button onclick="subscribe(${video.channel_id})">

Subscribe

</button>

<span id="subscribers-${video.channel_id}">
</span>


            <p>

            ${video.description}

            </p>



            <button class="like"
onclick="likeVideo(${video.id})">

👍 <span id="likes-${video.id}">
${video.likes ? video.likes.length : 0}
</span>

</button>




            <button class="dislike"
onclick="dislikeVideo(${video.id})">

👎 <span id="dislikes-${video.id}">
${video.dislikes ? video.dislikes.length : 0}
</span>

</button>



            `;



            box.appendChild(div);



        });



    }catch(e){


        console.log(e);


        box.innerHTML =
        "Error loading videos";


    }



}









async function likeVideo(id){

    const token = localStorage.token;

    if(!token){
        alert("Login required");
        return;
    }


    const res =
    await fetch("/videos/like/"+id,{

        method:"POST",

        headers:{
            Authorization:
            "Bearer "+token
        }

    });


    const data =
    await res.json();


    if(data.success){

        document.getElementById(
            "likes-"+id
        ).innerHTML =
        data.likes;

    }else{

        alert(data.error);

    }

}





async function dislikeVideo(id){

    const token = localStorage.token;

    if(!token){
        alert("Login required");
        return;
    }


    const res =
    await fetch("/videos/dislike/"+id,{

        method:"POST",

        headers:{
            Authorization:
            "Bearer "+token
        }

    });


    const data =
    await res.json();


    if(data.success){

        document.getElementById(
            "dislikes-"+id
        ).innerHTML =
        data.dislikes;

    }else{

        alert(data.error);

    }

}



async function deleteAccount(){

    const password =
    prompt("Enter your password");


    if(!password){
        return;
    }


    let code = null;


    try{

        const userRes =
        await fetch("/accounts/me",{

            headers:{
                "Authorization":
                "Bearer "+localStorage.token
            }

        });


        const userData =
        await userRes.json();



        if(
            userData.success &&
            userData.user.twoFA === true
        ){

            code =
            prompt("Enter your authentication code");


            if(!code){
                return;
            }

        }



    }catch(error){

        alert("Failed to check account security");
        return;

    }



    const confirmDelete =
    confirm(
        "Are you sure you want to delete your account?"
    );


    if(!confirmDelete){
        return;
    }



    const res =
    await fetch("/accounts/delete",{

        method:"POST",

        headers:{

            "Content-Type":
            "application/json",

            "Authorization":
            "Bearer "+localStorage.token

        },


        body:JSON.stringify({

            password:password,

            code:code

        })

    });



    const data =
    await res.json();



    if(data.success){

        alert(
            "Account deleted successfully"
        );


        localStorage.removeItem("token");

        location.reload();


    }else{

        alert(data.error);

    }


}


async function subscribe(id){

    const token =
    localStorage.token;


    if(!token){

        alert("Login required");

        return;

    }



    const res =
    await fetch(

        "/channels/subscribe/"+id,

        {

            method:"POST",

            headers:{

                "Authorization":
                "Bearer "+token

            }

        }

    );



    const data =
    await res.json();



    if(data.success){

        const counter =
        document.getElementById(
            "subscribers-"+id
        );


        if(counter){

            counter.innerHTML =
            " Subscribers: "+data.subscribers;

        }

    }else{

        alert(data.error);

    }

}


checkUser();

loadVideos();


</script>


</body>

</html>
