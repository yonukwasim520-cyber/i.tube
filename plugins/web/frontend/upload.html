<!DOCTYPE html>
<html>

<head>

<title>Upload Video - i.Tube</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#111;
    color:white;
}

header{
    background:#181818;
    padding:20px;
    font-size:28px;
    font-weight:bold;
    color:red;
}

.container{
    max-width:500px;
    margin:50px auto;
    background:#222;
    padding:25px;
    border-radius:15px;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:8px;
    background:#333;
    color:white;
}

textarea{
    height:100px;
}

button{
    width:100%;
    padding:14px;
    background:red;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:18px;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

#progress{

    width:100%;
    height:18px;

    background:#333;

    border-radius:20px;

    overflow:hidden;

    margin-top:20px;

    display:none;

}

#bar{

    width:0%;

    height:100%;

    background:#16a34a;

    transition:.15s;

}

#percent{

    text-align:center;

    margin-top:10px;

    font-weight:bold;

}

#result{

    margin-top:15px;

}

</style>

</head>

<body>

<header>

i.Tube

</header>

<div class="container">

<h2>Upload Video</h2>

<input
id="title"
placeholder="Video title">

<textarea
id="description"
placeholder="Description"></textarea>

<select id="privacy">

<option value="public">
Public
</option>

<option value="private">
Private
</option>

</select>

<select id="type">

<option value="normal">
Normal Video
</option>

<option value="short">
Shorts
</option>

</select>

<input
id="video"
type="file"
accept="video/*">

<button
id="uploadBtn"
onclick="upload()">

Upload

</button>

<div id="progress">

<div id="bar"></div>

</div>

<div id="percent"></div>

<p id="result"></p>

</div>

<script>

function upload(){

const token=
localStorage.token;

if(!token){

document.getElementById("result").innerHTML=
"Please login first";

return;

}

const file=
document.getElementById("video").files[0];

if(!file){

document.getElementById("result").innerHTML=
"Select video";

return;

}

const form=
new FormData();

form.append(
"video",
file
);

form.append(
"title",
document.getElementById("title").value
);

form.append(
"description",
document.getElementById("description").value
);

form.append(
"privacy",
document.getElementById("privacy").value
);

form.append(
"type",
document.getElementById("type").value
);

const xhr=
new XMLHttpRequest();

xhr.open(
"POST",
"/videos/upload",
true
);

xhr.setRequestHeader(
"Authorization",
"Bearer "+token
);

document.getElementById("progress").style.display="block";

document.getElementById("bar").style.width="0%";

document.getElementById("percent").innerHTML="0%";

document.getElementById("uploadBtn").disabled=true;

document.getElementById("uploadBtn").innerHTML=
"Uploading...";

xhr.upload.onprogress=function(e){

if(e.lengthComputable){

const percent=
Math.round(
(e.loaded/e.total)*100
);

document.getElementById("bar").style.width=
percent+"%";

document.getElementById("percent").innerHTML=
percent+"%";

document.getElementById("uploadBtn").innerHTML=
"Uploading "+percent+"%";

}

};

xhr.onload=function(){

document.getElementById("uploadBtn").disabled=false;

document.getElementById("uploadBtn").innerHTML=
"Upload";

if(xhr.status===200){

const data=
JSON.parse(xhr.responseText);

if(data.success){

document.getElementById("bar").style.width="100%";

document.getElementById("percent").innerHTML=
"100%";

document.getElementById("result").style.color=
"#22c55e";

document.getElementById("result").innerHTML=
"✅ Upload completed";

setTimeout(()=>{

location.href="index.html";

},1500);

}else{

document.getElementById("result").style.color=
"#ef4444";

document.getElementById("result").innerHTML=
data.error;

}

}else{

document.getElementById("result").style.color=
"#ef4444";

document.getElementById("result").innerHTML=
"Upload failed";

}

};

xhr.onerror=function(){

document.getElementById("uploadBtn").disabled=false;

document.getElementById("uploadBtn").innerHTML=
"Upload";

document.getElementById("result").style.color=
"#ef4444";

document.getElementById("result").innerHTML=
"Network error";

};

xhr.send(form);

}

</script>

</body>

</html>
